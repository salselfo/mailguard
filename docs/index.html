<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MailGuard, verifica mittente</title>
<style>
  :root { color-scheme: light dark; --ok:#1a7f37; --unknown:#6b7280; --warn:#b45309; --danger:#c62828; }
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; padding: 16px; max-width: 560px; margin-inline: auto; }
  h1 { font-size: 1.4rem; margin: .2em 0; }
  .sub { color: var(--unknown); margin-top: 0; }
  label { display: block; margin: 14px 0 4px; font-weight: 600; font-size: .9rem; }
  input, textarea { width: 100%; box-sizing: border-box; padding: 12px; font: inherit; border: 1px solid #8884; border-radius: 10px; background: transparent; color: inherit; }
  textarea { min-height: 120px; font-family: ui-monospace, monospace; font-size: .8rem; }
  details { margin-top: 12px; } summary { cursor: pointer; }
  button { margin-top: 16px; width: 100%; padding: 14px; font: inherit; font-weight: 700; border: 0; border-radius: 10px; background: #1d4ed8; color: #fff; }
  #out { margin-top: 20px; border-radius: 12px; border: 2px solid var(--c); padding: 14px; }
  #badge { font-weight: 800; font-size: 1.15rem; color: var(--c); }
  #out ul { padding-left: 1.1em; margin: 10px 0 0; }
  #out li { margin: 6px 0; }
  li.ok::marker { color: var(--ok); } li.unknown::marker { color: var(--unknown); }
  li.warn::marker { color: var(--warn); } li.danger::marker { color: var(--danger); }
  footer { margin-top: 28px; font-size: .8rem; color: var(--unknown); }
</style>
</head>
<body>
<h1>Verifica mittente</h1>
<p class="sub">Incolla l'indirizzo da cui hai ricevuto la mail.</p>

<label for="sender">Indirizzo del mittente</label>
<input id="sender" type="text" inputmode="email" autocomplete="off" autocapitalize="off" placeholder="avvisi@esempio.it">

<label for="extra">Nome mostrato o oggetto (facoltativo)</label>
<input id="extra" type="text" autocomplete="off" placeholder="Es. INPS, rimborso in sospeso">

<details>
  <summary>Intestazioni complete (per scoprire lo spoofing)</summary>
  <p class="sub">In Gmail: apri la mail, menu ⋮, "Mostra originale", copia tutto e incolla qui.</p>
  <textarea id="hdr" placeholder="Authentication-Results: ..."></textarea>
</details>

<button id="go">Verifica</button>

<section id="out" hidden>
  <div id="badge"></div>
  <ul id="list"></ul>
</section>

<footer id="foot"></footer>

<script type="module">
import { analyze, dnsChecks, summarize } from './core.js';

let brands = [], threats = new Set(), meta = null, changes = [];
const $ = (id) => document.getElementById(id);
const LABEL = { ok: 'Dominio ufficiale', unknown: 'Non determinabile', warn: 'Sospetto', danger: 'Minaccia probabile' };
const COLOR = { ok: 'var(--ok)', unknown: 'var(--unknown)', warn: 'var(--warn)', danger: 'var(--danger)' };

async function j(url) { try { const r = await fetch(url, { cache: 'no-cache' }); return r.ok ? await r.json() : null; } catch { return null; } }

async function load() {
  const b = await j('brands.json'); brands = b ? b.brands : [];
  const t = await j('data/threats.json'); if (t) threats = new Set(t.domains || []);
  meta = await j('data/meta.json');
  changes = (await j('data/changelog.json')) || [];
  const f = $('foot');
  const upd = meta && meta.updated ? new Date(meta.updated).toLocaleString('it-IT') : 'mai';
  f.textContent = `Ultimo aggiornamento automatico: ${upd}. Domini segnalati in archivio: ${threats.size}.`;
  if (changes.length) {
    const c = changes[0];
    f.append(document.createElement('br'), `Ultima novità: ${c.brand}, ${c.detail}`);
  }
}

function render(level, findings) {
  const out = $('out'); out.hidden = false;
  out.style.setProperty('--c', COLOR[level]);
  $('badge').textContent = LABEL[level];
  const ul = $('list'); ul.replaceChildren();
  for (const f of findings) {
    const li = document.createElement('li');
    li.className = f.level; li.textContent = f.text; ul.append(li);
  }
}

$('go').addEventListener('click', async () => {
  const input = { sender: $('sender').value, extra: $('extra').value, headers: $('hdr').value, brands, threats };
  const res = analyze(input);
  render(res.level, res.findings);
  if (!res.sender.valid) return;
  const official = res.findings.some((f) => f.level === 'ok' && f.text.includes('tra quelli ufficiali'));
  const more = await dnsChecks(res.sender.domain, { official });
  if (more.length) {
    const all = [...res.findings, ...more];
    render(summarize(all), all);
  }
});

load();
</script>
</body>
</html>
