name: Aggiornamento MailGuard

on:
  schedule:
    - cron: "17 5 * * *"   # ogni giorno alle 05:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui aggiornatore
        run: python updater/update.py
      - name: Salva eventuali modifiche
        run: |
          git config user.name "mailguard-bot"
          git config user.email "mailguard-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Aggiornamento automatico dati"
          git push
